services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: ./server/database
    environment:
      MONGODB_URL: mongodb://mongo:27017/dealershipsDB
    ports: ["3030:3030"]
    depends_on:
      mongo: {condition: service_healthy}
  sentiment:
    build: ./server/djangoapp/microservices
    ports: ["5000:5000"]
  web:
    build: ./server
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      SQLITE_PATH: /app/data/db.sqlite3
      BACKEND_URL: http://api:3030
      SENTIMENT_URL: http://sentiment:5000
    ports: ["8000:8000"]
    volumes: [django-data:/app/data]
    depends_on: [api, sentiment]
volumes:
  mongo-data:
  django-data:
